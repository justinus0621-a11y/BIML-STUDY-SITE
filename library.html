<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PR 도서관 · BIML STUDY</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body data-page="library">
<header class="top" id="header"></header>
<section class="page-head"><div class="wrap"><h1>🏛️ PR 도서관</h1><p>지금까지 발표한 논문을 모두 모아두었습니다.</p></div></section>
<div class="wrap"><div class="notice" id="notice" hidden></div></div>
<section class="block">
  <div class="wrap">
    <div class="toolbar">
      <div class="search"><input id="q" type="search" placeholder="논문 제목, 주제, 발표자로 검색" /></div>
      <select id="fPresenter"><option value="">전체 발표자</option></select>
      <select id="fSort">
        <option value="new">최신 발표순</option>
        <option value="old">오래된 발표순</option>
        <option value="year">논문 연도순</option>
      </select>
    </div>
    <div class="chips" id="chips"></div>
    <div class="count" id="count"></div>
    <div class="pr-list" id="prList"><div class="skeleton"></div><div class="skeleton"></div></div>
  </div>
</section>
<footer id="footer"></footer>
<script src="assets/app.js"></script>
</body>
</html>
